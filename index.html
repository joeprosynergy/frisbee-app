    /* Attention-grabbing "Copy last week" button: a gradient border that flows around it + a soft pulsing glow */
    @property --egr-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    .glow-btn {
      display: block;
      width: 100%;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #1565c0;
      cursor: pointer;
      -webkit-appearance: none;
      background:
        linear-gradient(#fff, #fff) padding-box,
        conic-gradient(from var(--egr-angle, 0deg), #1976d2, #26c6da, #7e57c2, #29b6f6, #1976d2) border-box;
      animation: egr-glow-spin 4s linear infinite, egr-glow-pulse 2.8s ease-in-out infinite;
    }
    .glow-btn:active { transform: scale(0.99); }
    @keyframes egr-glow-spin { to { --egr-angle: 360deg; } }
    @keyframes egr-glow-pulse {
      0%, 100% { box-shadow: 0 0 7px rgba(38,198,218,0.35), 0 0 14px rgba(25,118,210,0.22); }
      50%      { box-shadow: 0 0 13px rgba(38,198,218,0.60), 0 0 24px rgba(25,118,210,0.40); }

<script>
const SUPABASE_URL = 'https://yogymlpqgqjqragrxqgf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvZ3ltbHBxZ3FqcXJhZ3J4cWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyOTg1ODAsImV4cCI6MjA4ODg3NDU4MH0.6D8B_jK-tLi2g32xNTxkJwQGbJLW798ufCt869rPZgw';

let adminPass = null;
let adminName = null;
let logExpanded = false;

function headers() {
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
}

// Stable per-device id so the server can target push notifications to the right person
function deviceId() {
  try {
    let id = localStorage.getItem('egr_device_id');
    if (!id) {
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('d-' + Date.now() + '-' + Math.random().toString(36).slice(2));
      localStorage.setItem('egr_device_id', id);
    }
    return id;
  } catch (e) { return null; }
}

async function rpc(fn, params) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST', headers: headers(), body: JSON.stringify(params)
  });
  if (!res.ok) { const err = await res.json(); throw new Error(err.message || 'Failed'); }
  if (res.status === 204) return null;
  return res.json();
}

async function query(table, params = '', attempt = 0) {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000); // never hang forever
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: headers(), signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  } catch (e) {
    if (attempt < 1) return query(table, params, attempt + 1); // one quick retry on a stall/blip
    throw e;
  }
}

async function insert(table, data) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST', headers: headers(), body: JSON.stringify(data)
  });
  return res;
}

function toast(msg, ms = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;
}

function formatTime(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hour = h % 12 || 12;
  return `${hour}:${String(m).padStart(2, '0')} ${ampm}`;
}

function timeAgo(dateStr) {
  const now = new Date();
  const d = new Date(dateStr);
  const mins = Math.floor((now - d) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  return `${days}d ago`;
}

function esc(str) {
  const el = document.createElement('span');
  el.textContent = str;
  return el.innerHTML;
}

function escAttr(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// Proper HTML-attribute escaper for value="..." (escAttr above is for JS-string contexts only)
function escAttrHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Remember the names this device signed up, so a player can spot their own row
function myNames() {
  try { return new Set(JSON.parse(localStorage.getItem('egr_my_names') || '[]')); }
  catch (e) { return new Set(); }
}
function rememberMyName(name) {
  const s = myNames();
  s.add(name.trim().toLowerCase());
  try { localStorage.setItem('egr_my_names', JSON.stringify([...s])); } catch (e) {}
}
let myNameSet = myNames();

// After a signup + refresh, tell the player their true position (in vs waitlist)
function signupMessage(gameId, name) {
  const d = gamesData[gameId];
  const n = (name || '').trim().toLowerCase();
  if (!d) return `${name} is in!`;
  const r = d.roster.findIndex(p => (p.player_name || '').toLowerCase() === n);
  if (r !== -1) return `${name} is in!  (#${r + 1})`;
  const w = d.waitlist.findIndex(p => (p.player_name || '').toLowerCase() === n);
  if (w !== -1) return `${name} is on the waitlist — spot W${w + 1}`;
  return `${name} is in!`;
}

// Log an activity
async function logActivity(gameId, action, playerName, actorName, isAdmin) {
  try {
    await insert('activity_log', {
      game_id: gameId,
      action: action,
      player_name: playerName || null,
      actor_name: actorName || null,
      is_admin: isAdmin || false
    });
  } catch (e) {
    console.error('Failed to log activity', e);
  }
}

// Cache game labels and data for log display and copy
let gameLabels = {};
let gamesData = {};
const byCreated = (a, b) => (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0);

async function loadGames() {
  const container = document.getElementById('games-container');
  try {
    // One round-trip: games WITH their signups embedded (halves the mobile latency)
    let gamesParam = 'select=*,signups(id,player_name,created_at)&order=game_date.asc,game_time.asc&signups.order=created_at.asc';
    gamesParam += adminPass ? '&status=in.(draft,live)' : '&status=eq.live';
    // On the first load, reuse the request the <head> already fired (overlaps the HTML download).
    // Falls back to a fresh query if it's missing, mismatched, errors, or stalls past 8s.
    let games;
    const pf = window.__egrPrefetch;
    if (pf && pf.params === gamesParam && !pf.used) {
      pf.used = true;
      try {
        games = await Promise.race([
          pf.promise,
          new Promise((_, rej) => setTimeout(() => rej(new Error('prefetch timeout')), 8000))
        ]);
      } catch (e) {
        games = await query('games', gamesParam);
      }
    } else {
      games = await query('games', gamesParam);
    }
    renderGames(games);
    // Save the rendered roster so the next open paints instantly (player view only).
    // The head-fired fetch still runs and overwrites this — no extra request, no delay.
    if (!adminPass) {
      try { localStorage.setItem('egr_snapshot', JSON.stringify({ ts: Date.now(), games })); } catch (e) {}
    }
  } catch (e) {
    container.innerHTML = '<div class="empty-state">Couldn\'t load &mdash; your connection may be slow.<br><button class="btn-copy" style="margin-top:12px;" onclick="loadGames()">Retry</button></div>';
    console.error(e);
  }
}

function renderGames(games) {
  const container = document.getElementById('games-container');
  myNameSet = myNames();
  const archiveSection = document.getElementById('archive-section');
  if (!games || !games.length) {
    container.innerHTML = '<div class="empty-state">No games scheduled yet.</div>';
    if (archiveSection) archiveSection.style.display = adminPass ? 'block' : 'none';
    return;
  }

  // Cache labels
  for (const g of games) { gameLabels[g.id] = g.label; }

  let html = '';
  for (const game of games) {
      const players = (game.signups || []).slice().sort(byCreated);
      const roster = players.slice(0, game.max_players);
      const waitlist = players.slice(game.max_players);
      const spotsLeft = Math.max(0, game.max_players - roster.length);
      const isDraft = game.status === 'draft';

      html += `<div class="card${isDraft ? ' draft-card' : ''}">
        <div class="game-header">
          <div>
            <div class="game-label">${esc(game.label)}${isDraft ? '<span class="draft-badge">Draft</span>' : ''}</div>
            <div class="game-meta">${formatDate(game.game_date)} &middot; ${formatTime(game.game_time)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            ${players.length ? `<button class="btn-copy" onclick="event.stopPropagation();copyList('${game.id}')">Copy</button>` : ''}
            <span class="spots-badge ${spotsLeft > 0 ? 'spots-open' : 'spots-full'}">
              ${spotsLeft > 0 ? spotsLeft + ' spot' + (spotsLeft !== 1 ? 's' : '') : 'Full'}
            </span>
          </div>
        </div>`;

      if (roster.length) {
        html += `<div class="roster"><div class="roster-title">Playing (${roster.length}/${game.max_players})</div>`;
        roster.forEach((p, i) => {
          html += playerRow(i + 1, p, game.id);
        });
        html += `</div>`;
      }

      if (waitlist.length) {
        html += `<div class="waitlist-divider">Waitlist</div><div class="roster">`;
        waitlist.forEach((p, i) => {
          html += playerRow('W' + (i + 1), p, game.id);
        });
        html += `</div>`;
      }

      // Store data for copy
      gamesData[game.id] = { game, roster, waitlist };

      if (!isDraft) {
        html += `<div class="signup-area">
          <div class="signup-row">
            <input type="text" id="name-${game.id}" placeholder="Name" maxlength="30" onkeydown="if(event.key==='Enter')signup('${game.id}')">
            <button class="btn-join" onclick="signup('${game.id}')">I'm in</button>
          </div>
          <div class="signup-hint">Enter the name of the person you want to sign up</div>
        </div>`;
      }

      if (adminPass) {
        html += `<div class="game-admin-actions">`;
        html += `<button class="btn-edit" onclick="toggleEditGame('${game.id}')">Edit</button>`;
        if (isDraft) {
          html += `<button class="btn-publish" onclick="publishGame('${game.id}')">Go Live</button>`;
        }
        html += `<button class="btn-danger btn-small" onclick="deleteGame('${game.id}')">Delete Game</button>
        </div>`;
        html += `<div class="edit-form" id="edit-form-${game.id}" style="display:none;">
          <div class="form-group">
            <label>Label</label>
            <input type="text" id="edit-label-${game.id}" value="${escAttrHtml(game.label)}">
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="edit-date-${game.id}" value="${game.game_date}">
          </div>
          <div class="form-group">
            <label>Time</label>
            <input type="time" id="edit-time-${game.id}" value="${game.game_time}">
          </div>
          <div class="form-group">
            <label>Max Players</label>
            <input type="number" id="edit-max-${game.id}" value="${game.max_players}" min="2" max="50">
          </div>
          <div class="form-group">
            <label>Google Maps link (optional)</label>
            <input type="url" id="edit-maps-${game.id}" value="${escAttrHtml(game.maps_link || '')}" placeholder="Paste a Google Maps link">
          </div>
          <div class="edit-form-actions">
            <button class="btn-save" onclick="saveEditGame('${game.id}')">Save</button>
            <button class="btn-cancel" onclick="toggleEditGame('${game.id}')">Cancel</button>
          </div>
        </div>`;
      }

      html += `</div>`;
    }

  container.innerHTML = html;
  if (archiveSection) archiveSection.style.display = adminPass ? 'block' : 'none';
}

function toggleArchives() {
  const container = document.getElementById('archive-container');
  const btn = document.getElementById('archive-toggle');
  const showing = container.style.display !== 'none';
  if (showing) {
    container.style.display = 'none';
    btn.classList.remove('open');
  } else {
    container.style.display = 'block';
    btn.classList.add('open');
    loadArchives();
  }
}

async function loadArchives() {
  const container = document.getElementById('archive-container');
  try {
    const games = await query('games', 'select=*,signups(id,player_name,created_at)&status=eq.archived&order=game_date.desc,game_time.desc&signups.order=created_at.asc');
    if (!games.length) {
      container.innerHTML = '<div class="card"><div class="empty-state" style="padding:16px;">No archived games.</div></div>';
      return;
    }
    for (const g of games) { gameLabels[g.id] = g.label; }

    let html = '';
    for (const game of games) {
      const players = (game.signups || []).slice().sort(byCreated);
      const roster = players.slice(0, game.max_players);
      const waitlist = players.slice(game.max_players);

      gamesData[game.id] = { game, roster, waitlist };

      html += `<div class="card archived-card">
        <div class="game-header">
          <div>
            <div class="game-label">${esc(game.label)}<span class="archived-badge">Archived</span></div>
            <div class="game-meta">${formatDate(game.game_date)} &middot; ${formatTime(game.game_time)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            ${players.length ? `<button class="btn-copy" onclick="event.stopPropagation();copyList('${game.id}')">Copy</button>` : ''}
          </div>
        </div>`;

      if (roster.length) {
        html += `<div class="roster"><div class="roster-title">Played (${roster.length})</div>`;
        roster.forEach((p, i) => {
          html += `<div class="player-row" style="cursor:default;">
            <span class="player-num">${i + 1}</span>
            <span class="player-name">${esc(p.player_name)}</span>
          </div>`;
        });
        html += `</div>`;
      }

      if (waitlist.length) {
        html += `<div class="waitlist-divider">Waitlist</div><div class="roster">`;
        waitlist.forEach((p, i) => {
          html += `<div class="player-row" style="cursor:default;">
            <span class="player-num">W${i + 1}</span>
            <span class="player-name">${esc(p.player_name)}</span>
          </div>`;
        });
        html += `</div>`;
      }

      html += `<div class="game-admin-actions">
        <button class="btn-unarchive" onclick="unarchiveGame('${game.id}')">Unarchive</button>
        <button class="btn-danger btn-small" onclick="deleteGame('${game.id}')">Delete Game</button>
      </div></div>`;
    }
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<div class="card"><div class="empty-state" style="padding:16px;">Couldn\'t load archives.</div></div>';
  }
}

async function unarchiveGame(gameId) {
  try {
    await rpc('unarchive_game', { pass: adminPass, p_game_id: gameId });
    toast('Game restored!');
    loadGames();
    loadArchives();
  } catch (e) { toast('Error unarchiving game'); }
}

function playerRow(num, player, gameId) {
  const safeName = escAttr(player.player_name);
  const isMe = myNameSet.has((player.player_name || '').toLowerCase());
  return `<div class="player-row${isMe ? ' me' : ''}">
    <span class="player-num">${num}</span>
    <span class="player-name">${esc(player.player_name)}${isMe ? ' <span class="you-tag">you</span>' : ''}</span>
    <span class="player-x" onclick="removePlayer('${gameId}','${safeName}')">&times;</span>
  </div>`;
}

async function signup(gameId) {
  const input = document.getElementById(`name-${gameId}`);
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const btn = input.closest('.signup-row') && input.closest('.signup-row').querySelector('.btn-join');
  if (btn) btn.disabled = true;

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/signups`, {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ game_id: gameId, player_name: name, device_id: deviceId() })
    });
    if (!res.ok) {
      const err = await res.json();
      if (err.code === '23505') {
        toast(`${name} is already signed up! Same name? Add your last initial (e.g. "${name} B.")`, 6000);
      } else {
        toast('Error signing up');
      }
      return;
    }
    logActivity(gameId, 'signup', name, name, !!adminPass); // best-effort, off the critical path
    rememberMyName(name);
    input.value = '';
    await loadGames();
    toast(signupMessage(gameId, name));
  } catch (e) {
    toast('Error signing up');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// In-page confirm dialog (native prompt/confirm are unreliable in installed PWAs)
function askRemove(playerName, needName) {
  return new Promise((resolve) => {
    const ov = document.getElementById('modal-overlay');
    const wrap = document.getElementById('modal-name-wrap');
    const input = document.getElementById('modal-name');
    const okBtn = document.getElementById('modal-ok');
    const cancelBtn = document.getElementById('modal-cancel');
    document.getElementById('modal-title').textContent = `Remove ${playerName}?`;
    input.value = '';
    wrap.style.display = needName ? 'block' : 'none';
    ov.style.display = 'flex';
    if (needName) setTimeout(() => input.focus(), 60);
    function done(result) { ov.style.display = 'none'; okBtn.onclick = null; cancelBtn.onclick = null; input.onkeydown = null; resolve(result); }
    okBtn.onclick = () => {
      const nm = needName ? input.value.trim() : '';
      if (needName && !nm) { input.focus(); return; }
      done({ name: nm });
    };
    cancelBtn.onclick = () => done(null);
    input.onkeydown = (e) => { if (e.key === 'Enter') okBtn.onclick(); };
  });
}

async function loadLog(full) {
  const container = document.getElementById('log-container');
  logExpanded = full;

  try {
    let params = 'order=created_at.desc';
    if (full) {
      // Last 7 days
      const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
      params += `&created_at=gte.${weekAgo}`;
    } else {
      params += '&limit=10';
    }

    const logs = await query('activity_log', params);

    if (!logs.length) {
      container.innerHTML = '<div class="card"><div class="empty-state" style="padding:16px;">No activity yet.</div></div>';
      return;
    }

    let html = '<div class="card"><div class="log-list">';
    for (const entry of logs) {
      const label = gameLabels[entry.game_id] || 'a game';
      let desc = '';

      switch (entry.action) {
        case 'signup':
          desc = `<strong>${esc(entry.player_name)}</strong> signed up for ${esc(label)}`;
          break;
        case 'remove':
          desc = `<strong>${esc(entry.actor_name)}</strong> removed <strong>${esc(entry.player_name)}</strong> from ${esc(label)}`;
          break;
        case 'admin_remove':
          desc = `<strong>${esc(entry.actor_name)}</strong> (admin) removed <strong>${esc(entry.player_name)}</strong> from ${esc(label)}`;
          break;
        case 'game_created':
          desc = `<strong>${esc(entry.actor_name)}</strong> created ${esc(entry.player_name || label)}`;
          break;
        case 'game_published':
          desc = `<strong>${esc(entry.actor_name)}</strong> published ${esc(entry.player_name || label)}`;
          break;
        case 'game_deleted':
          desc = `<strong>${esc(entry.actor_name)}</strong> deleted ${esc(entry.player_name || 'a game')}`;
          break;
        default:
          desc = `${esc(entry.action)}`;
      }

      html += `<div class="log-entry">
        <span class="log-action">${desc}</span><br>
        <span class="log-time">${timeAgo(entry.created_at)}</span>
      </div>`;
    }
    html += '</div>';

    if (!full && logs.length >= 10) {
      html += `<div class="log-more"><button onclick="loadLog(true)">Show full week</button></div>`;
    }

    html += '</div>';
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<div class="card"><div class="empty-state" style="padding:16px;">Couldn\'t load activity.</div></div>';
  }
}

// "Copy last week" → pop a picker of recent games (any status, incl. archived) so the

let copyCandidates = [];

async function openCopyPicker() {
  try {
    const recent = await query('games', 'select=label,game_time,max_players,game_date,maps_link&order=game_date.desc,game_time.desc&limit=12');
    if (!recent || !recent.length) { toast('No previous game to copy yet'); return; }
    // Show games from roughly the last couple of weeks; if there's been a long gap,
    // still offer the most recent one so the button always does something.
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() - 16);
    let list = recent.filter(g => new Date(g.game_date + 'T00:00:00') >= cutoff).slice(0, 8);
    if (!list.length) list = recent.slice(0, 1);
    copyCandidates = list;
    document.getElementById('copy-options').innerHTML = list.map((g, i) =>
      `<button class="copy-option" onclick="pickCopyGame(${i})">
        <span class="copy-option-main">${esc(g.label)}</span>

// Pre-fill the Create Game form from the chosen game, date bumped a week to the same weekday.
function pickCopyGame(i) {
  const g = copyCandidates[i];
  if (!g) return;
  const last = new Date(g.game_date + 'T00:00:00');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const next = new Date(last); next.setDate(next.getDate() + 7);
  while (next < today) next.setDate(next.getDate() + 7); // skipped weeks → roll forward, same weekday
  const iso = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;
  document.getElementById('game-date').value = iso;
  document.getElementById('game-time').value = (g.game_time || '18:15').slice(0, 5);
  document.getElementById('game-label').value = g.label || '';
  document.getElementById('game-max').value = g.max_players || 18;
  document.getElementById('game-maps').value = g.maps_link || '';
  closeCopyModal();
  toast(`Copied "${g.label}" → ${formatDate(iso)}. Check it, then Create Game.`, 4000);
}

// ---- Push notifications (PWA) ----
const VAPID_PUBLIC_KEY = 'BF6KthGI3ivHVQ7hTFuEmeN8aNA5WzQt7e_bMWxYyhndFqZIqHCk0WhrgkVtznzVw_lCO6C7Labk1d1abs-0WKE';
let swReg = null;

function urlB64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

function pushSupported() {
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

// Is this existing subscription tied to the CURRENT VAPID key? (false → stale, replace it)
function subKeyMatches(sub) {
  try {
    const want = urlB64ToUint8Array(VAPID_PUBLIC_KEY);
    const have = new Uint8Array(sub.options.applicationServerKey);
    if (have.length !== want.length) return false;
    for (let i = 0; i < want.length; i++) if (have[i] !== want[i]) return false;
    return true;
  } catch (e) { return true; } // can't determine → don't churn it
}

// Save a subscription to the DB. return=minimal avoids a SELECT-back that RLS blocks
// (that was the "could not enable alerts" bug); ignore-duplicates makes it idempotent,
// so we can safely re-store the same device on every load.
function storeSubscription(sub) {
  const j = sub.toJSON();
  const row = { endpoint: sub.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent, device_id: deviceId() };
  return fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions`, {
    method: 'POST',
    headers: { ...headers(), 'Prefer': 'return=minimal' },
    body: JSON.stringify(row)
  }).then(async (res) => {
    if (res.status === 409) {
      // endpoint already stored → keep its device_id current
      await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, {
        method: 'PATCH', headers: { ...headers(), 'Prefer': 'return=minimal' },
        body: JSON.stringify({ device_id: deviceId(), user_agent: navigator.userAgent })
      });
    }
    return res;
  });
}

async function initNotify() {
  if (!pushSupported()) return; // unsupported browser → leave the bar hidden
  document.getElementById('notify-bar').style.display = 'block';
  try {
    await navigator.serviceWorker.register('/sw.js');
    swReg = await navigator.serviceWorker.ready;
  } catch (e) {}
  await refreshNotifyState();
  // Self-heal: if this device already subscribed (current key) but the row never saved, save it now.
  try {
    const sub = swReg && await swReg.pushManager.getSubscription();
    if (sub && subKeyMatches(sub)) await storeSubscription(sub);
  } catch (e) {}
}

async function refreshNotifyState() {
  const btn = document.getElementById('notify-btn');
  const hint = document.getElementById('notify-hint');
  hint.textContent = '';
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isIOS && !standalone) {
    btn.textContent = '🔔 Get game alerts';
    btn.classList.remove('on');
    hint.textContent = 'On iPhone: tap Share → Add to Home Screen, then open it from your home screen and turn alerts on.';
    return;
  }
  if (Notification.permission === 'denied') {
    btn.textContent = '🔔 Alerts blocked';
    btn.classList.remove('on');
    hint.textContent = 'Notifications are blocked — enable them in your browser settings.';
    return;
  }
  const sub = swReg && await swReg.pushManager.getSubscription();
  if (sub && subKeyMatches(sub)) { btn.textContent = '🔔 Alerts on ✓'; btn.classList.add('on'); }
  else { btn.textContent = '🔔 Get game alerts'; btn.classList.remove('on'); }
}

async function toggleNotify() {
  if (!pushSupported()) return;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isIOS && !standalone) {
    toast('On iPhone: tap Share → Add to Home Screen first, then open it and turn alerts on.', 6000);
    return;
  }
  const btn = document.getElementById('notify-btn');
  if (btn) btn.disabled = true;
  try {
    await navigator.serviceWorker.register('/sw.js');
    swReg = await navigator.serviceWorker.ready; // wait for the SW to be ACTIVE before subscribing
    const existing = await swReg.pushManager.getSubscription();
    if (existing && subKeyMatches(existing)) {
      // valid current subscription → second tap means turn OFF
      const endpoint = existing.endpoint;
      await existing.unsubscribe();
      await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?endpoint=eq.${encodeURIComponent(endpoint)}`, { method: 'DELETE', headers: headers() });
      toast('Alerts turned off');
      await refreshNotifyState();
      return;
    }
    if (existing) {
      // stale subscription from an old key → drop it, then subscribe fresh below
      try { await existing.unsubscribe(); } catch (e) {}
      fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?endpoint=eq.${encodeURIComponent(existing.endpoint)}`, { method: 'DELETE', headers: headers() }).catch(() => {});
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      toast(perm === 'denied' ? 'Notifications are blocked — enable them in settings' : 'Notifications not allowed');
      await refreshNotifyState();
      return;
    }
    const sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY) });
    const res = await storeSubscription(sub);
    if (res.ok || res.status === 201 || res.status === 409) {
      toast("Done — you'll get game alerts on this device 🔔", 4000);
    } else {
      const t = await res.text().catch(() => '');
      console.error('subscription save failed', res.status, t);
      toast('Could not save your subscription (' + res.status + '). Try again.');
    }
    await refreshNotifyState();
  } catch (e) {
    console.error('enable push failed', e);
    toast('Could not enable alerts: ' + ((e && e.message) || 'unknown error'), 5000);
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ---- Pull-to-refresh (custom; native is disabled via overscroll-behavior) ----
(function setupPTR() {
  const ptr = document.getElementById('ptr');
  if (!ptr) return;
  let startY = 0, pulling = false, pull = 0;
  const THRESH = 65;
  window.addEventListener('touchstart', (e) => {
    const modal = document.getElementById('modal-overlay');
    const modalOpen = modal && modal.style.display === 'flex';
    if (!modalOpen && window.scrollY <= 0 && e.touches.length === 1) {
      startY = e.touches[0].clientY; pulling = true; pull = 0; ptr.classList.remove('snap');
    } else pulling = false;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0 || window.scrollY > 0) { pulling = false; ptr.style.transform = 'translateX(-50%) translateY(-100%)'; ptr.style.opacity = '0'; return; }
    pull = Math.min(dy * 0.5, 80);
    ptr.style.transform = `translateX(-50%) translateY(${Math.max(pull - 36, 4)}px)`;
    ptr.style.opacity = String(Math.min(1, pull / THRESH));
    ptr.classList.toggle('ready', pull >= THRESH);
  }, { passive: true });
  window.addEventListener('touchend', async () => {
    if (!pulling) return;
    pulling = false;
    ptr.classList.add('snap');
    if (pull >= THRESH) {
      ptr.style.transform = 'translateX(-50%) translateY(12px)';
      ptr.style.opacity = '1';
      ptr.classList.add('refreshing');
      try { await loadGames(); } catch (e) {}
      ptr.classList.remove('refreshing', 'ready');
    }
    ptr.style.transform = 'translateX(-50%) translateY(-100%)';
    ptr.style.opacity = '0';
  });
})();

  } catch (e) {}
  loadGames();
}

initNotify();
initInstall();
</script>
